<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Primary S Upper Ribbon Gradient -->
    <linearGradient id="primaryRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Secondary S Lower Ribbon Gradient -->
    <linearGradient id="secondaryRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" />

  <!-- The Iconic Interlocking "S" Monogram -->
  <g filter="url(#shadow)">
    <!-- Upper Flowing Ribbon of "S" -->
    <path d="M 370 148
             C 370 120, 345 98, 305 98
             L 205 98
             C 155 98, 122 135, 122 182
             C 122 228, 160 252, 225 270
             L 285 286
             C 335 300, 362 318, 362 344
             C 362 356, 355 366, 342 374
             L 378 402
             C 402 380, 414 354, 414 322
             C 414 262, 365 235, 298 216
             L 242 200
             C 192 186, 172 172, 172 152
             C 172 136, 186 126, 210 126
             L 302 126
             C 324 126, 340 134, 348 144
             Z"
          fill="url(#primaryRibbon)" />

    <!-- Lower Flowing Ribbon of "S" -->
    <path d="M 142 364
             C 142 392, 167 414, 207 414
             L 307 414
             C 357 414, 390 377, 390 330
             C 390 284, 352 260, 287 242
             L 227 226
             C 177 212, 150 194, 150 168
             C 150 156, 157 146, 170 138
             L 134 110
             C 110 132, 98 158, 98 190
             C 98 250, 147 277, 214 296
             L 270 312
             C 320 326, 340 340, 340 360
             C 340 376, 326 386, 302 386
             L 210 386
             C 188 386, 172 378, 164 368
             Z"
          fill="url(#secondaryRibbon)" />

    <!-- Core Dynamic Accent Node (Financial Growth Spark) -->
    <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
  </g>
</svg>
