<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="favRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="favRibbon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded badge container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Bold stylized "S" monogram -->
  <!-- Upper curve -->
  <path d="M 45 19
           C 45 14, 40 11, 33 11
           L 24 11
           C 17 11, 13 16, 13 22
           C 13 28, 18 31, 26 33
           L 35 35
           C 41 37, 44 40, 44 45
           C 44 48, 42 50, 39 52
           L 44 55
           C 48 52, 51 48, 51 43
           C 51 34, 44 30, 35 28
           L 28 26
           C 22 24, 19 22, 19 19
           C 19 16, 22 15, 26 15
           L 35 15
           C 39 15, 41 16, 43 18
           Z"
        fill="url(#favRibbon1)" />

  <!-- Lower curve -->
  <path d="M 19 45
           C 19 50, 24 53, 31 53
           L 40 53
           C 47 53, 51 48, 51 42
           C 51 36, 46 33, 38 31
           L 29 29
           C 23 27, 20 24, 20 19
           C 20 16, 22 14, 25 12
           L 20 9
           C 16 12, 13 16, 13 21
           C 13 30, 20 34, 29 36
           L 36 38
           C 42 40, 45 42, 45 45
           C 45 48, 42 49, 38 49
           L 29 49
           C 25 49, 23 48, 21 46
           Z"
        fill="url(#favRibbon2)" />

  <!-- Center core accent point -->
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8" />
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
</svg>
